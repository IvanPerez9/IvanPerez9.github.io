<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iván Pérez - Portfolio">
    <title>404 - Page Not Found</title>

    <link rel="shortcut icon" href="assets/images/cv-green2.png" title="LogoIcon">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
    <div class="error-page">
        <div class="error-content">
            <h1 class="error-code">4<span>0</span>4</h1>
            <p class="error-message" data-i18n="404.text">Oops! Page Not Found</p>
            <p class="error-description" data-i18n="404.description">The page you're looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i>
                <span data-i18n="404.goBack">Go Back Home</span>
            </a>
        </div>
    </div>

    <script type="module" src="assets/js/modern-main.js"></script>
